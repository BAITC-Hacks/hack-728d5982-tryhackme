[project]
name = "hackalem-ekt-assistant"
version = "0.1.0"
description = "HackAlem: single-chat catalogue assistant and confirmed session cart for ekt.kz"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "fastapi>=0.136.3,<0.137",
    "httpx>=0.28.1,<0.29",
    "openai>=3.19,<4",
    "pillow>=12.3,<13",
    "pydantic>=2.13,<3",
    "pymupdf>=1.28,<2",
    "python-calamine>=0.8.2,<0.9",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.2,<2",
    "uvicorn[standard]>=0.53,<0.54",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "ty>=0.0.83,<0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

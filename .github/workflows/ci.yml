name: HackAlem CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --directory backend --frozen
      - name: Lint and type check
        working-directory: backend
        run: |
          uv run ruff check app tests generate_ekt_catalog_openapi.py generate_landing_openapi.py
          uv run ruff format app tests generate_ekt_catalog_openapi.py generate_landing_openapi.py --check
          uv run ty check
      - name: Check generated contracts
        working-directory: backend
        run: |
          uv run python generate_ekt_catalog_openapi.py --check
          uv run python generate_landing_openapi.py --check
      - name: Catalogue fixtures, attachments and protected cart
        run: uv run --directory backend pytest
      - name: Build standalone assistant image
        run: docker build -f backend/Dockerfile -t hackalem-assistant .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run type-check
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile landing journeys
        run: npm run test:landing
      - name: Next.js desktop and mobile journeys
        run: npm run test:next
      # Live tests are opt-in locally; CI has no partner or OpenAI secrets.
